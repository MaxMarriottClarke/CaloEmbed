# Plot config for caloembed-plot.
# Add one entry per run under 'runs'. 'label' is optional — falls back to
# the pipeline name stored in the summary.

output_dir: plots/physics/

energy_min: 20
energy_max: 300
n_energy_bins: 14

# Total LC energy axis for number ratio (leave out to auto-range from data)
# ratio_energy_min: 40
# ratio_energy_max: 600
n_ratio_bins: 14

runs:
  - summary: results/d10/cluestering/summary.json
    label: "d10: CLUEstering (tuned to d5)"
  - summary: results/d10/clue3d/summary.json
    label: "d10: CLUE3D"
  - summary: results/d5/cluestering_opt/summary.json
    label: "d5: CLUEstering (tuned to d5)"
  - summary: results/d5/clue3d/summary.json
    label: "d5: CLUE3D"

