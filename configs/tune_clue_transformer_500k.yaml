# Tune CLUEstering parameters with MOPSO on the 500k-event geo_transformer.
#
# Identical to configs/tune_clue_transformer.yaml (which tunes the 200k V100
# model) apart from model.run_dir and output.dir — same events, same bounds,
# same seed, same particle/iteration counts — so the two Pareto fronts are
# directly comparable and any difference is attributable to the model alone.
#
# Usage:
#   caloembed-tune-clue-transformer --config configs/tune_clue_transformer_500k.yaml
#   caloembed-tune-clue-transformer --config configs/tune_clue_transformer_500k.yaml --resume

model:
  run_dir: results/training/geo_transformer_a6000_500k   # config.yaml + best.pt

data:
  # Cross-dataset test, same convention as tune_clue_gnn.yaml: the model was
  # trained on d7, evaluated here on d5.
  dir: /vols/cms/mm1221/cms/Data/d5/100k_mix/hdf5
  n_events: 5000

output:
  dir: results/param_tuning/transformer_clue_500k_d5

clustering:
  backend: auto       # auto → gpu cuda > cpu openmp > cpu serial
  ppbin: 128
  block_size: 1024
  device_id: 0

metrics:
  min_lc: 3

# Parameters to tune. Bounds are on the embedding scale: the geo_transformer
# output is raw (unnormalized) Euclidean R^3, with the discriminative loss
# targeting delta_v=0.5 (intra-cluster) and delta_d=1.5 (inter-cluster) — see
# model.run_dir/config.yaml. Both models were trained with the same delta_v /
# delta_d, so the 200k model's bounds carry over unchanged.
parameters:
  dc:
    lower:   0.001
    upper:   2.0
    default: 0.3
  rhoc:
    lower:   0.01
    upper:   20.0
    default: 1.0
  do:
    lower:   0.001
    upper:   5.0
    default: 1.0
  dm:
    lower:   0.001
    upper:   5.0
    default: 0.8

mopso:
  n_particles:          40
  n_iterations:         45
  seed:                 42
  inertia_weight:       0.5
  cognitive_coefficient: 1.5
  social_coefficient:   2.0
  topology: lower_weighted_crowding_distance
  initial_position: random

objectives:
  under_cluster_penalty: 1000.0
