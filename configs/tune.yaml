# CLUE3D parameter tuning with MOPSO multi-objective optimisation.
#
# Usage:
#   caloembed-tune --config configs/tune.yaml
#   caloembed-tune --config configs/tune.yaml --output results/tune_run2
#   caloembed-tune --config configs/tune.yaml --resume          # continue from checkpoint

pipeline: raw   

data:
  dir: /vols/cms/mm1221/cms/Data/d5/100k_mix/hdf5
  n_events: 10000

output:
  dir: results/param_tuning/raw_noPU_d5

clustering:
  backend: auto       # auto → gpu cuda > cpu openmp > cpu serial
  ppbin: 128
  block_size: 1024
  device_id: 0

metrics:
  min_lc: 3

# Parameters to tune.
parameters:
  dc:
    lower:   0.01
    upper:   20.0
    default: 2.6125   
  rhoc:
    lower:   0.1
    upper:   20.0
    default: 1.4012   
  do:
    lower:   0.01
    upper:  50.0
    default: 5.1886   
  dm:
    lower:   0.01
    upper:   50.0
    default: 3.1692   
  z_scale:
    lower:   0.01
    upper:   2.0
    default: 0.55     

mopso:
  n_particles:          40    
  n_iterations:        60     
  seed:                 42    
  inertia_weight:      0.5    
  cognitive_coefficient: 1.5  
  social_coefficient:   2.0   
  topology: lower_weighted_crowding_distance  
                                              
                                              
                                              
  initial_position: random  
                            
objectives:
  under_cluster_penalty: 1000.0
