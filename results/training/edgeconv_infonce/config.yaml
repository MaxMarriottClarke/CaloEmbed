data:
  dir: /vols/cms/mm1221/cms/Data/d5/100k_mix/hdf5/
  features:
  - x
  - y
  - z
  - energy
  - eta
  - phi
  max_files: -1
  max_events: -1
  val_fraction: 0.1
  test_fraction: 0.0
  batch_size: 32
  num_workers: 2
model:
  name: edgeconv
  hidden_dim: 64
  num_layers: 4
  out_dim: 16
  k: 20
  dropout: 0.1
loss:
  name: infonce
  temperature: 0.1
optim:
  lr: 0.0003
  weight_decay: 0.0
  scheduler: cosine
train:
  epochs: 50
  amp: true
  grad_clip: null
  seed: 42
output:
  dir: /vols/cms/mm1221/cms/CaloEmbed/results/training/edgeconv_infonce
