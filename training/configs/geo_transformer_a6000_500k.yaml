# Geometric transformer + energy/purity-weighted margin loss (learned CLUE
# coordinates). See docs/learned-coords-for-clue.md.
data:
  dir: /vols/cms/mm1221/cms/Data/d7/1M_2_10_pi_e_d7p5_E10_300/hdf5/
  # sin/cos phi instead of raw phi: removes the wrap discontinuity, and their
  # pairwise differences give the model a wrap-free delta-phi (see model.geom_idx).
  # n_hits / E-per-hit from the design doc are not in this HDF5 and would need a
  # new CMSSW dump, so they are omitted.
  features: [x, y, z, energy, eta, sin_phi, cos_phi]
  max_files: 5000      # 5000 files x 100 events = 500k events
  max_events: -1       # per-split cap, -1 = all
  val_fraction: 0.1    # file-level split, stratified by n_cp, deterministic in train.seed
  test_fraction: 0.0   # held out entirely (recorded in <output>/splits.json, never loaded)
  batch_size: 4        # real batch; effective batch = batch_size * train.accum_steps
  num_workers: 2
  # Attention runs on a dense (B, S, F) tensor, so a batch costs B*S^2 where S is
  # its largest event. Random batching over n_lc ~ 950-3500 wastes 1.9x of the
  # compute on padding; bucketing similar-sized events together recovers it.
  bucket_by_size: true
  bucket_pool_batches: 50   # sort within pools of 50 batches, not globally

model:
  name: geo_transformer
  hidden_dim: 128
  num_layers: 6
  n_heads: 8
  out_dim: 3           # CLUE is density-based; 3D keeps density meaningful
  geom_idx: [0, 1, 2, 4, 5, 6]   # x, y, z, eta, sin_phi, cos_phi in data.features order
  bias_hidden: 32
  bias_chunk: 512      # query-block size for the checkpointed geometry-bias MLP
  ffn_mult: 2
  drop_path: 0.1

loss:
  name: discriminative
  delta_v: 0.5         # blob radius, in CLUE units of dc = 1
  delta_d: 1.5         # half the minimum center-to-center gap
  reg_weight: 1.0e-3
  purity_p0: 0.5       # purity ramp start (stored fraction is 1/multiplicity)
  purity_floor: 0.1    # shared hits keep a small pull so they commit to one side

optim:
  optimizer: adamw
  lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.05   # applied to matrices only, not biases/norms
  scheduler: warmup_cosine
  warmup_fraction: 0.05

train:
  epochs: 30           # ~1.7 h/epoch estimated -> ~50 h, inside +MaxRuntime = 300000 s
  amp: true
  precision: bf16      # fp16 | bf16 (bf16 needs no loss scaling)
  grad_clip: 1.0
  accum_steps: 8       # effective batch 32
  seed: 42

output:
  dir: /vols/cms/mm1221/cms/CaloEmbed/results/training/geo_transformer_a6000_500k
