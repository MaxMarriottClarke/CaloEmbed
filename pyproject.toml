[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caloembed"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "torch",
    "pyyaml",
    "matplotlib",
    "uproot",
    "awkward",
    "umap-learn",
    "scikit-learn",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
caloembed-run    = "caloembed.scripts.run_pipeline:main"
caloembed-plot   = "caloembed.scripts.plot_metrics:main"
caloembed-clue3d = "caloembed.scripts.run_clue3d_baseline:main"
caloembed-tune      = "caloembed.scripts.tune_clue:main"
caloembed-tune-clue-gnn = "caloembed.scripts.tune_clue_gnn:main"
caloembed-tune-clue-transformer = "caloembed.scripts.tune_clue_transformer:main"
caloembed-tune-agglo = "caloembed.scripts.tune_agglomerative:main"
caloembed-run-agglo  = "caloembed.scripts.run_agglomerative:main"
caloembed-plot-tune = "caloembed.scripts.plot_tune:main"
caloembed-display   = "caloembed.scripts.plot_3d_events:main"
caloembed-plot-loss = "caloembed.scripts.plot_loss:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["caloembed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real data files (deselect with -m 'not integration')"]
