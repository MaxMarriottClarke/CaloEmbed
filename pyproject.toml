[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "caloembed"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "pyyaml",
    "matplotlib",
    "uproot",
    "awkward",
    "umap-learn",
    "scikit-learn",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
caloembed-run = "caloembed.scripts.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["caloembed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real data files (deselect with -m 'not integration')"]
